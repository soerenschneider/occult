---
on:
  push:
    branches:
      - main

permissions:
  contents: read

name: release

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: GoogleCloudPlatform/release-please-action@v5.0.0
        name: release
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
          package-name: ${{ github.repository }}

  build-and-upload:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload release assets
      id-token: write  # cosign keyless signing via GitHub OIDC
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: build binaries and checksums
        run: make release VERSION="${TAG}"

      - uses: sigstore/cosign-installer@v3

      - name: sign checksums with cosign
        run: cosign sign-blob --yes --bundle builds/checksum.sha256.cosign.bundle builds/checksum.sha256

      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" builds/* --clobber
